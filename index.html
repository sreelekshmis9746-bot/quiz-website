<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Quiz ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      min-height: 100vh;
      margin: 0;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-container {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      color: #ff4f81;
      margin-bottom: 10px;
    }

    #questionNumber {
      color: #777;
      margin-bottom: 20px;
    }

    #question {
      margin-bottom: 25px;
      color: #333;
    }

    .option {
      margin: 12px 0;
      text-align: left;
    }

    .option label {
      display: block;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option label:hover {
      background: #fff0f5;
      border-color: #ff758c;
    }

    .option input {
      margin-right: 10px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff4f81;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #e83e70;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .correct {
      color: green;
    }

    .wrong {
      color: red;
    }

    .score {
      font-size: 24px;
      color: #ff4f81;
      font-weight: bold;
      margin-top: 20px;
    }

    #restartButton {
      display: none;
      background: #28a745;
    }

    #restartButton:hover {
      background: #218838;
    }
  </style>
</head>

<body>

  <div class="quiz-container">

    <h1>❤️ Love Quiz ❤️</h1>

    <div id="questionNumber"></div>

    <h2 id="question">Question</h2>

    <div id="options"></div>

    <button id="submitButton" onclick="checkAnswer()">
      Submit
    </button>

    <div class="result" id="result"></div>

    <div class="score" id="score"></div>

    <button id="restartButton" onclick="restartQuiz()">
      Play Again ❤️
    </button>

  </div>


  <script>

    // ==========================
    // QUIZ QUESTIONS
    // ==========================

    const quizData = [

      {
        question: "Do you love me? ❤️",
        options: ["Yes", "No"],
        answer: "Yes"
      },

      {
        question: "How much do you love me? 🥰",
        options: ["100%", "1000%", "Infinity ❤️"],
        answer: "Infinity ❤️"
      },

      {
        question: "Are you happy with me? 😊",
        options: [
          "Really happy with you",
          "No",
          "Sometimes"
        ],
        answer: "Really happy with you"
      },

      {
        question: "Will you stay with me forever? 💕",
        options: [
          "Yes ❤️",
          "No",
          "Maybe"
        ],
        answer: "Yes ❤️"
      },

      {
        question: "Who is your favorite person? 😍",
        options: [
          "Me ❤️",
          "Someone else",
          "Nobody"
        ],
        answer: "Me ❤️"
      }

    ];


    // ==========================
    // VARIABLES
    // ==========================

    let currentQuestion = 0;
    let selectedOption = "";
    let score = 0;


    // ==========================
    // LOAD QUESTION
    // ==========================

    function loadQuestion() {

      const q = quizData[currentQuestion];

      // Question number
      document.getElementById("questionNumber").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        quizData.length;

      // Question text
      document.getElementById("question").innerText =
        q.question;

      // Clear previous options
      const optionsDiv =
        document.getElementById("options");

      optionsDiv.innerHTML = "";

      // Reset selected answer
      selectedOption = "";

      // Create options
      q.options.forEach((opt, index) => {

        const optionDiv =
          document.createElement("div");

        optionDiv.className = "option";

        optionDiv.innerHTML = `
          <label>
            <input
              type="radio"
              name="option"
              value="${opt}"
            >
            ${opt}
          </label>
        `;

        optionsDiv.appendChild(optionDiv);

      });


      // Clear result
      document.getElementById("result").innerText = "";

      // Clear score
      document.getElementById("score").innerText = "";

    }


    // ==========================
    // SELECT ANSWER
    // ==========================

    document.addEventListener("change", function(event) {

      if (event.target.name === "option") {

        selectedOption =
          event.target.value;

      }

    });


    // ==========================
    // CHECK ANSWER
    // ==========================

    function checkAnswer() {

      // Check if user selected an option
      if (!selectedOption) {

        document.getElementById("result").innerText =
          "⚠️ Please select an option!";

        document.getElementById("result").className =
          "result wrong";

        return;
      }


      const q = quizData[currentQuestion];


      // Check correct answer
      if (selectedOption === q.answer) {

        // Increase score
        score++;

        document.getElementById("result").innerText =
          "✅ Correct! ❤️";

        document.getElementById("result").className =
          "result correct";

      } else {

        document.getElementById("result").innerText =
          "❌ Wrong! Correct answer: " +
          q.answer;

        document.getElementById("result").className =
          "result wrong";

      }


      // Disable submit button
      document.getElementById("submitButton").disabled =
        true;


      // Move to next question
      currentQuestion++;


      // Load next question
      if (currentQuestion < quizData.length) {

        setTimeout(function() {

          document.getElementById("submitButton").disabled =
            false;

          loadQuestion();

        }, 1500);

      }

      // Quiz completed
      else {

        setTimeout(function() {

          showFinalScore();

        }, 1500);

      }

    }


    // ==========================
    // SHOW FINAL SCORE
    // ==========================

    function showFinalScore() {

      document.getElementById("questionNumber").innerText =
        "Quiz Finished 🎉";

      document.getElementById("question").innerText =
        "Thank you for playing! ❤️";

      document.getElementById("options").innerHTML =
        "";

      document.getElementById("result").innerText =
        "";

      document.getElementById("score").innerText =
        "Your Score: " +
        score +
        " / " +
        quizData.length;

      // Hide submit button
      document.getElementById("submitButton").style.display =
        "none";

      // Show restart button
      document.getElementById("restartButton").style.display =
        "inline-block";


      // Extra message
      if (score === quizData.length) {

        document.getElementById("score").innerText +=
          "\n\n💖 Perfect Score! You really love me! 💖";

      }

      else if (score >= quizData.length / 2) {

        document.getElementById("score").innerText +=
          "\n\n🥰 Great job!";

      }

      else {

        document.getElementById("score").innerText +=
          "\n\n💕 Try again!";

      }

    }


    // ==========================
    // RESTART QUIZ
    // ==========================

    function restartQuiz() {

      currentQuestion = 0;

      selectedOption = "";

      score = 0;


      // Show submit button
      document.getElementById("submitButton").style.display =
        "inline-block";

      // Hide restart button
      document.getElementById("restartButton").style.display =
        "none";


      // Enable submit button
      document.getElementById("submitButton").disabled =
        false;


      // Load first question
      loadQuestion();

    }


    // ==========================
    // START QUIZ
    // ==========================

    loadQuestion();

  </script>

</body>
</html>
